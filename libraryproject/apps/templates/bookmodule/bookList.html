{% extends "layouts/base.html" %}
{% block title %} Search Results {% endblock title %}
{% block content %}
<style>
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    th, td {
        padding: 12px;
        text-align: left;
        border: 1px solid #ddd;
    }
    th {
        background-color: #f2f2f2;
        font-weight: bold;
    }
    tr:nth-child(even) {
        background-color: #f9f9f9;
    }
    h2 {
        border-bottom: 2px solid #333;
        padding-bottom: 10px;
    }
</style>
<h2>Search Results</h2>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
        </tr>
    </thead>
    <tbody>
        {% for obj in books %}
        <tr>
            <td>{{obj.id}}</td>
            <td>{{obj.title}}</td>
            <td>{{obj.author}}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<br>
<a href="{% url 'books.search' %}">Back to Search</a>
{% endblock content %}
