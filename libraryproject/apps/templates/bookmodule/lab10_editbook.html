{% extends "layouts/base.html" %}

{% block content %}
    <h2>Edit Book</h2>
    <form method="POST">
        {% csrf_token %}
        <p>Title: <input type="text" name="title" value="{{ book.title }}" required></p>
        <p>Price: <input type="number" step="0.01" name="price" value="{{ book.price }}" required></p>
        <p>Quantity: <input type="number" name="quantity" value="{{ book.quantity }}" required></p>
        <p>Rating: <input type="number" name="rating" min="1" max="5" value="{{ book.rating }}" required></p>
        <button type="submit">Update</button>
    </form>
    <br>
    <a href="{% url 'books.lab10_listbooks' %}">Cancel</a>
{% endblock %}
