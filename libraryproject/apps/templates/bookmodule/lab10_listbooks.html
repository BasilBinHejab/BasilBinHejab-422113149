{% extends "layouts/base.html" %}

{% block content %}
    <h2>Book List (Standard CRUD)</h2>
    <a href="{% url 'books.lab10_addbook' %}">Add New Book</a>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Rating</th>
            <th>Actions</th>
        </tr>
        {% for book in books %}
        <tr>
            <td>{{ book.id }}</td>
            <td>{{ book.title }}</td>
            <td>{{ book.price }}</td>
            <td>{{ book.quantity }}</td>
            <td>{{ book.rating }}</td>
            <td>
                <a href="{% url 'books.lab10_editbook' book.id %}">Edit</a> |
                <a href="{% url 'books.lab10_deletebook' book.id %}" onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
