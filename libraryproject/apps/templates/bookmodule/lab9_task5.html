{% extends 'layouts/base.html' %}
{% block content %}
<h2>Task 5: Publishers with High Rated Books Count</h2>
<table border="1">
    <tr>
        <th>Publisher Name</th>
        <th>High Rated Books (>3) Count</th>
    </tr>
    {% for publisher in publishers %}
    <tr>
        <td>{{ publisher.name }}</td>
        <td>{{ publisher.high_rated_count }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
