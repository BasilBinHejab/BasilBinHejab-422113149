{% extends "layouts/base.html" %}

{% block content %}
    <h2>Add New Book</h2>
    <form method="POST">
        {% csrf_token %}
        <p>Title: <input type="text" name="title" required></p>
        <p>Price: <input type="number" step="0.01" name="price" required></p>
        <p>Quantity: <input type="number" name="quantity" required></p>
        <p>Rating: <input type="number" name="rating" min="1" max="5" required></p>
        <button type="submit">Save</button>
    </form>
    <br>
    <a href="{% url 'books.lab10_listbooks' %}">Back to list</a>
{% endblock %}
