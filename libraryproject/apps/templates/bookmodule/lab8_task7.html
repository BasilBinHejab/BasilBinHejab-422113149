{% extends 'layouts/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Number of Students in Each City</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>City</th>
                <th>Student Count</th>
            </tr>
        </thead>
        <tbody>
            {% for city in city_counts %}
            <tr>
                <td>{{ city.city }}</td>
                <td>{{ city.student_count }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
