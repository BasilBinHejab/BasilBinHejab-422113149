{% extends 'layouts/base.html' %}
{% block content %}
<h2>Task 2: Publishers and Total Book Stock</h2>
<table border="1">
    <tr>
        <th>Publisher Name</th>
        <th>Total Stock</th>
    </tr>
    {% for publisher in publishers %}
    <tr>
        <td>{{ publisher.name }}</td>
        <td>{{ publisher.total_stock|default:0 }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
