{% extends 'layouts/base.html' %}
{% block content %}
<h2>Task 1: Books with Percentage Availability</h2>
<table border="1">
    <tr>
        <th>Title</th>
        <th>Quantity</th>
        <th>Availability (%)</th>
    </tr>
    {% for book in books %}
    <tr>
        <td>{{ book.title }}</td>
        <td>{{ book.quantity }}</td>
        <td>{{ book.availability|stringformat:".2f" }}%</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
